<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>

    <h1>Pedro Henrique Aranha da Silva</h1>

    <h2>Desenvolvendo Web em formação</h2>
    <nav> 
        <ul>
            <li><a href="index.html">Sobre mim</a></li>
            <li><a href="curriculo.html">Curriculo</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

    </header>
    <main> 

        <section>
            <h3>Fale comigo</h3>

            <form action="/contato" method="post">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" minlength="3" required>

                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>

                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone">

                        <label for="data">Data de Nascimento</label>
                        <input type="date" id="data" name="data">


                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>

                       <label for="cep">CEP</label>
                       <input type="text" id="cep" name="cep" pattern="[0-9]{8}" placeholder="Somente Números" required>

                       <label for="rua">Rua</label>
                       <input type="text" id="rua" name="rua">

                       <label for="numero">Número</label>
                       <input type="number" min="1" maxlength="99999" id="numero" name="numero" >

                       <label for="cidade">Cidade</label>
                       <input type="text" id="cidade" name="cidade">
                       
                       <label for="estado">Estado</label>
                       <input type="text" id="estado" name="estado">

                    <select name="estado">
                        <option value="PR">PR</option>
                        <option value="SP">SP</option>
                        <option value="RJ">RJ</option>
                        <option value="SC">SC</option>
                        <option value="RS">RS</option>
                    </select>

                </fieldset>

                <fieldset>
                    <legend>Interesse</legend>

                        <select name="interesse" required>
                            <option value="front-end">Front-End</option>
                            <option value="back-end">Back-End</option>
                            <option value="banco de dados">Banco de Dados</option>
                            <option value="full-stack">Full-Stack</option>
                        </select> 

                        <input type="radio" name="Nivel de Experiencia" value="iniciante" id="iniciante">
                        <label for="iniciante">Iniciante</label>

                        <input type="radio" name="Nivel de Experiencia" value="intermediario" id="intermediario">
                        <label for="intermediario">Intermediário</label>

                        <input type="radio" name="Nivel de Experiencia" value="avancado" id="avancado">
                        <label for="avancado">Avançado</label>
     
                        <label for="mensagem">Mensagem</label>
                        <textarea name="mensagem" rows="5" maxlength="500"></textarea>

                        <input type="checkbox" name="termos" id="termos" required>
                        <label for="termos">Li e concordo com os termos de uso</label>

                </fieldset>

                        <button type="submit">Enviar</button>
                
            </form>
        </section>
        </main>
        <footer>
            <p>© 2026 Pedro </p>

            </footer>


</body>
</html>
